<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- fontawsome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="tailwind.config.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-base-200">
    <section class="container w-[1110px] mx-auto">
      <header class="my-14">
        <h2 class="text-3xl text-blue-950 font-bold">
          Job Application Tracker
        </h2>
        <div class="card-parent flex mt-5 gap-4">
          <div class="card w-96 bg-white p-5 card-xs shadow">
            <div class="card-body">
              <p class="card-title text-base">Total</p>
              <h2 class="text-2xl font-extrabold">8</h2>
            </div>
          </div>
          <div class="card w-96 bg-white p-5 card-xs shadow">
            <div class="card-body">
              <p class="card-title">Interview</p>
              <h2 class="text-2xl font-extrabold text-green-400">0</h2>
            </div>
          </div>
          <div class="card w-96 bg-white p-5 card-xs shadow">
            <div class="card-body">
              <p class="card-title">Rejected</p>
              <h2 class="text-2xl font-extrabold text-red-500">8</h2>
            </div>
          </div>
        </div>
      </header>
      <main>
        <div class="main-top flex justify-between mb-6">
          <h3 class="text-xl text-blue-950 font-bold">Available Jobs</h3>
          <h4 class="text-md">8 jobs</h4>
        </div>
        <div class="btn-group flex gap-2 mb-4">
          <button class="btn btn-info">All</button>
          <button class="btn">Interview</button>
          <button class="btn">Rejected</button>
        </div>
      </main>
    </section>
  </body>
</html>
